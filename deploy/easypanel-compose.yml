# Serviço Compose do Whatomate no EasyPanel.
#
# A mídia das chamadas NÃO passa mais pelo container do app: ele fala com o
# coturn, que roda com `network_mode: host` e é quem conversa com a Meta.
#
# Por que foi preciso: com o app numa rede bridge/overlay, o ICE conectava mas o
# DTLS nunca fechava — o handshake morria e a chamada ficava muda. Duas causas
# concorriam. O container tinha duas interfaces (rede do projeto e overlay do
# Traefik), gerando dois candidatos `host` mascarados como o mesmo IP público,
# e o ICE podia fixar no socket errado. E o NAT do Docker não garante que a
# porta de origem da saída seja a mesma anunciada no candidato.
#
# A tentativa anterior publicava 41 portas UDP com `mode: host`. Isso nunca
# esteve em vigor: `mode` é campo exclusivo do Swarm e o EasyPanel roda
# `docker compose`, que o ignora. Com relay_only o app não precisa de porta
# aberta nenhuma — ele só faz conexão de saída para o coturn.
#
# Segredos NÃO ficam aqui: use deploy/render-compose.sh com deploy/.env.local.

services:
  whatomate:
    image: ghcr.io/lfmmachado/whatomate:latest
    # Sem isto o Docker reaproveita a imagem `latest` já em cache e o deploy do
    # painel não troca nada — o container segue na versão antiga, em silêncio.
    pull_policy: always
    restart: unless-stopped
    # `default` é a rede do projeto, por onde se fala com o Redis.
    # `easypanel` é a rede overlay do Traefik: sem ela o proxy resolve o nome do
    # container mas não alcança ninguém, e toda requisição volta 502.
    # Declarar `networks` desliga a adesão automática à default — daí as duas.
    #
    # O alias existe porque o EasyPanel gera o destino do Traefik como
    # <projeto>_<serviço>_<sub-serviço> — aqui `mooviin_whatomate_whatomate`,
    # com underscores. Os aliases que o compose cria sozinho usam hífen
    # (`mooviin_whatomate-whatomate-1`) ou são só o nome do serviço
    # (`whatomate`), então aquele nome não resolveria e o proxy segue em 502.
    networks:
      default:
      easypanel:
        aliases:
          - mooviin_whatomate_whatomate
    environment:
      TZ: America/Sao_Paulo

      WHATOMATE_APP__ENVIRONMENT: production
      WHATOMATE_APP__DEBUG: "false"
      WHATOMATE_APP__ENCRYPTION_KEY: ${WHATOMATE_ENCRYPTION_KEY}

      WHATOMATE_SERVER__HOST: 0.0.0.0
      WHATOMATE_SERVER__PORT: "8080"
      WHATOMATE_SERVER__ALLOWED_ORIGINS: https://${WHATOMATE_DOMAIN}

      # RDS direto, sem passar pelo pgbouncer: o app usa pgx, e pgbouncer em
      # modo transaction quebra prepared statements sob concorrência.
      WHATOMATE_DATABASE__HOST: ${RDS_HOST}
      WHATOMATE_DATABASE__PORT: "5432"
      WHATOMATE_DATABASE__USER: whatomate
      WHATOMATE_DATABASE__PASSWORD: ${RDS_PASSWORD}
      WHATOMATE_DATABASE__NAME: whatomate
      WHATOMATE_DATABASE__SSL_MODE: require

      WHATOMATE_REDIS__HOST: whatomate-redis
      WHATOMATE_REDIS__PORT: "6379"

      WHATOMATE_JWT__SECRET: ${WHATOMATE_JWT_SECRET}

      WHATOMATE_STORAGE__TYPE: local
      WHATOMATE_STORAGE__LOCAL_PATH: /app/uploads

      WHATOMATE_WHATSAPP__WEBHOOK_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      WHATOMATE_WHATSAPP__API_VERSION: v24.0
      WHATOMATE_WHATSAPP__APP_ID: ${META_APP_ID}
      WHATOMATE_WHATSAPP__APP_SECRET: ${META_APP_SECRET}

      WHATOMATE_COOKIE__SECURE: "true"
      WHATOMATE_RATE_LIMIT__ENABLED: "true"
      # atrás do Traefik: sem isso todo request conta como vindo do proxy
      WHATOMATE_RATE_LIMIT__TRUST_PROXY: "true"

      WHATOMATE_TTS__PIPER_BINARY: /usr/local/bin/piper
      WHATOMATE_TTS__PIPER_MODEL: /opt/piper/models/pt_BR-faber-medium.onnx

      WHATOMATE_CALLING__AUDIO_DIR: /app/audio
      WHATOMATE_CALLING__MAX_CALL_DURATION: "3600"
      WHATOMATE_CALLING__TRANSFER_TIMEOUT_SECS: "120"
      WHATOMATE_CALLING__RECORDING_ENABLED: "false"
      # Toda a mídia vai pelo coturn. Sem isto o pion também tenta candidatos
      # host, que é justamente o caminho que não funciona aqui.
      WHATOMATE_CALLING__RELAY_ONLY: "true"
      # Vazio de propósito: com relay_only, definir public_ip provoca erro de
      # negociação ICE (docs/features/calling.mdx). O IP público agora é
      # responsabilidade do coturn, via `external-ip` no turnserver.conf.
      WHATOMATE_CALLING__PUBLIC_IP: ""

      WHATOMATE_DEFAULT_ADMIN__EMAIL: ${ADMIN_EMAIL}
      WHATOMATE_DEFAULT_ADMIN__PASSWORD: ${ADMIN_PASSWORD}
      WHATOMATE_DEFAULT_ADMIN__FULL_NAME: Luiz Fernando

    volumes:
      - whatomate-uploads:/app/uploads
      - whatomate-audio:/app/audio

    # O app escreve o próprio config.toml ao subir. Isso existe por um motivo
    # específico: [[calling.ice_servers]] é lista de tabelas e o provider de env
    # do koanf não consegue montá-la (config.go:210), mas montar um arquivo do
    # host exigiria acesso SSH ao servidor para mantê-lo. Gerando aqui, o compose
    # passa a ser a única fonte de verdade — tudo editável pelo painel.
    entrypoint:
      - /bin/bash
      - -c
      - |
        cat > /app/config.toml <<'TOML'
        [app]
        name = "Whatomate"

        # O TURN pelo IP privado é para o SERVIDOR (evita o hairpin da AWS).
        [[calling.ice_servers]]
        urls = ["turn:172.31.21.234:3478"]
        secret = "${TURN_SECRET}"
        credential_ttl = 86400

        # O STUN público é para o NAVEGADOR do agente, e é obrigatório: esta
        # mesma lista é servida ao frontend (outgoing_calls.go:193), que não
        # alcança o IP privado. Sem um STUN, o navegador só gera candidatos da
        # LAN, o servidor cria a permissão TURN para o endereço errado e o
        # coturn descarta a mídia — chamada conecta e fica muda dos dois lados.
        [[calling.ice_servers]]
        urls = ["stun:stun.l.google.com:19302"]
        TOML
        exec ./whatomate server -config /app/config.toml -migrate

    healthcheck:
      # A imagem não traz curl nem wget, então /dev/tcp do bash é o que resta.
      # Testa só a porta — não banco e Redis, como o /ready faria. Assim que uma
      # imagem com curl estiver publicada, trocar por:
      #   test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/ready"]
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    deploy:
      replicas: 1
      resources:
        limits:
          # teto para o pico do TTS (piper + ffmpeg + opusenc) não derrubar
          # Chatwoot/n8n na mesma máquina
          memory: 1G
      restart_policy:
        condition: any

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # A razão de existir deste serviço: rede host = zero NAT do Docker no
    # caminho da mídia. É o que o app não podia ter, por precisar do Traefik.
    network_mode: host
    # Tudo por linha de comando, sem arquivo montado — mesmo motivo do
    # entrypoint acima: não depender de arquivo no host.
    #
    # A faixa de relay é 10001-10040 de propósito: o security group da EC2
    # (sg-83e445e6) já libera UDP 10000-10040 desde a tentativa anterior, então
    # nenhuma regra nova é necessária. A porta de controle 3478 NÃO precisa
    # estar aberta: só o app, na mesma máquina, fala com ela.
    #
    # external-ip mapeia público/privado porque a interface da EC2 só enxerga o
    # IP privado; sem isso os candidatos de relay anunciariam 172.31.21.234.
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=chat.mooviin.app
      - --external-ip=3.93.191.20/172.31.21.234
      - --min-port=10001
      - --max-port=10040
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --no-cli
      - --stale-nonce=600
      - --total-quota=100
      - --log-file=stdout
      - --simple-log
    deploy:
      resources:
        limits:
          memory: 128M

  whatomate-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # sem `ports`: só a rede interna do projeto alcança
    command: >-
      redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - whatomate-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  whatomate-uploads:
  whatomate-audio:
  whatomate-redis-data:

networks:
  # criada e mantida pelo EasyPanel; overlay com attachable=true, o que permite
  # um container de compose comum entrar nela
  easypanel:
    external: true
