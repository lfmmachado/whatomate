    environment:
      TZ: America/Sao_Paulo

      WHATOMATE_APP__ENVIRONMENT: production
      WHATOMATE_APP__DEBUG: "false"
      WHATOMATE_APP__ENCRYPTION_KEY: ${WHATOMATE_ENCRYPTION_KEY}

      WHATOMATE_SERVER__HOST: 0.0.0.0
      WHATOMATE_SERVER__PORT: "8080"
      WHATOMATE_SERVER__ALLOWED_ORIGINS: https://${WHATOMATE_DOMAIN}

      # RDS direto, sem passar pelo pgbouncer: o app usa pgx, e pgbouncer em
      # modo transaction quebra prepared statements sob concorrência.
      WHATOMATE_DATABASE__HOST: ${RDS_HOST}
      WHATOMATE_DATABASE__PORT: "5432"
      WHATOMATE_DATABASE__USER: whatomate
      WHATOMATE_DATABASE__PASSWORD: ${RDS_PASSWORD}
      WHATOMATE_DATABASE__NAME: whatomate
      WHATOMATE_DATABASE__SSL_MODE: require

      WHATOMATE_REDIS__HOST: redis
      WHATOMATE_REDIS__PORT: "6379"

      WHATOMATE_JWT__SECRET: ${WHATOMATE_JWT_SECRET}

      WHATOMATE_STORAGE__TYPE: local
      WHATOMATE_STORAGE__LOCAL_PATH: /app/uploads

      WHATOMATE_WHATSAPP__WEBHOOK_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      WHATOMATE_WHATSAPP__API_VERSION: v24.0
      WHATOMATE_WHATSAPP__APP_ID: ${META_APP_ID}
      WHATOMATE_WHATSAPP__APP_SECRET: ${META_APP_SECRET}

      WHATOMATE_COOKIE__SECURE: "true"
      WHATOMATE_RATE_LIMIT__ENABLED: "true"
      # atrás do Traefik: sem isso todo request conta como vindo do proxy
      WHATOMATE_RATE_LIMIT__TRUST_PROXY: "true"

      WHATOMATE_TTS__PIPER_BINARY: /usr/local/bin/piper
      WHATOMATE_TTS__PIPER_MODEL: /opt/piper/models/pt_BR-faber-medium.onnx

      WHATOMATE_CALLING__AUDIO_DIR: /app/audio
      WHATOMATE_CALLING__MAX_CALL_DURATION: "3600"
      WHATOMATE_CALLING__TRANSFER_TIMEOUT_SECS: "120"
      WHATOMATE_CALLING__RECORDING_ENABLED: "false"
      WHATOMATE_CALLING__UDP_PORT_MIN: "10000"
      WHATOMATE_CALLING__UDP_PORT_MAX: "10040"
      # IP público da instância. Se ficar vazio ou desatualizado, o ICE anuncia
      # 172.31.21.234 e nenhuma chamada conecta.
      # ATENÇÃO: hoje isto é o IP auto-atribuído (3.93.191.20), não um Elastic
      # IP — ele MUDA em qualquer stop/start da EC2. Depois de um restart da
      # instância, atualizar esta variável no painel e redeployar, ou alocar um
      # EIP e esquecer o assunto.
      WHATOMATE_CALLING__PUBLIC_IP: ${PUBLIC_IP}

      WHATOMATE_DEFAULT_ADMIN__EMAIL: ${ADMIN_EMAIL}
      WHATOMATE_DEFAULT_ADMIN__PASSWORD: ${ADMIN_PASSWORD}
      WHATOMATE_DEFAULT_ADMIN__FULL_NAME: Luiz Fernando

    volumes:
      - uploads:/app/uploads
      - audio:/app/audio
      # Conteúdo de deploy/config.mount.toml, criado como File Mount no painel.
      # Só carrega o [[calling.ice_servers]], que não cabe em env var.
      - /etc/easypanel/projects/whatomate/config.toml:/app/config.toml:ro

    healthcheck:
      # /ready valida banco e Redis; /health só responde que o processo subiu
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    deploy:
      replicas: 1
      resources:
        limits:
          # teto para o pico do TTS (piper + ffmpeg + opusenc) não derrubar
          # Chatwoot/n8n na mesma máquina
          memory: 1G
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # sem `ports`: só a rede interna do projeto alcança
    command: >-
      redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  uploads:
  audio:
  redis-data:
