# Serviço Compose do Whatomate no EasyPanel (Docker Swarm).
#
# Por que Compose e não a tela padrão de serviço: o range UDP da mídia precisa
# ser publicado em `mode: host`. No modo ingress (padrão do Swarm) o IPVS faz
# SNAT nos pacotes, o container passa a ver um endereço de origem mascarado e as
# verificações de conectividade do ICE falham — a chamada conecta e fica muda.
#
# O Swarm não aceita range ("10000-10040:10000-10040/udp") na sintaxe longa, e a
# sintaxe curta só produz ingress. Daí uma entrada por porta, geradas abaixo.
# 41 portas ≈ 20 chamadas simultâneas (cada chamada abre ~2 PeerConnections:
# uma para a Meta, outra para o navegador do agente).
#
# Segredos NÃO ficam aqui: as ${VARIAVEIS} são preenchidas na aba de ambiente do
# EasyPanel. A lista completa está no README desta pasta.

services:
  whatomate:
    image: ghcr.io/lfmmachado/whatomate:latest
    restart: unless-stopped
    ports:
      - target: 10000
        published: 10000
        protocol: udp
        mode: host
      - target: 10001
        published: 10001
        protocol: udp
        mode: host
      - target: 10002
        published: 10002
        protocol: udp
        mode: host
