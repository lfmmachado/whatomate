# coturn para a mídia das chamadas do WhatsApp.
# Vai em /etc/easypanel/projects/whatomate/turnserver.conf no host.
# NÃO commitar a versão com o segredo real preenchido.

listening-port=3478
fingerprint

# Credenciais REST: o Whatomate deriva usuário/senha efêmeros por HMAC deste
# segredo (config.go:79). O mesmo valor vai no `secret` do bloco ice_servers.
use-auth-secret
static-auth-secret=COLE_O_TURN_SECRET

realm=chat.mooviin.app

# Na EC2 a interface só enxerga o IP privado. Sem esta linha o coturn anuncia
# 172.31.21.234 nos candidatos relay e a Meta não consegue enviar mídia.
# Formato: <público>/<privado>. Atualizar o lado esquerdo ao alocar um EIP.
external-ip=3.93.191.20/172.31.21.234

# Faixa de portas de relay. Precisa estar liberada em UDP no security group.
min-port=49160
max-port=49200

# Sem TLS: o coturn está na mesma máquina que o app, e a mídia já é
# criptografada pelo DTLS-SRTP do próprio WebRTC.
no-tls
no-dtls

no-multicast-peers
no-cli
stale-nonce=600
total-quota=100

log-file=stdout
simple-log
