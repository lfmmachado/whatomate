name: Deploy

# Publica a imagem no GHCR e avisa o EasyPanel para puxar a versão nova.
# Só roda depois que o workflow "Test" (do upstream) passa em main, para não
# duplicar aqui a matriz de testes com Postgres/Redis.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # o contexto `secrets` não é acessível em `if:` de step — passa por env
      DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          # workflow_run não posiciona o checkout no commit testado sozinho
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só amd64: a instância de destino é t2.medium (x86_64). Buildar arm64
      # junto dobraria o tempo de CI sem ninguém para consumir a imagem.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O EasyPanel expõe um webhook por serviço; POST nele = pull + redeploy.
      # Sem o secret configurado o passo é pulado (deploy vira manual no painel).
      - name: Trigger EasyPanel deploy
        if: env.DEPLOY_WEBHOOK != ''
        run: |
          code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK")
          echo "HTTP $code"; cat /tmp/resp.txt
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo "\`${IMAGE}:${SHA}\`" >> $GITHUB_STEP_SUMMARY
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "Webhook não configurado — faça o deploy pelo painel do EasyPanel." >> $GITHUB_STEP_SUMMARY
          fi
